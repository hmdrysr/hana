
# Unzip workflow: upload a ZIP to the repository root to unpack it.
name: unzip

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create safe ZIP unpacker
        run: |
          cat > "$RUNNER_TEMP/unpack.py" <<'PYTHON'
          import posixpath
          import re
          import stat
          import sys
          import zipfile
          from pathlib import Path

          def clean_name(name):
              if "\\" in name or name.startswith("/") or re.match(r"^[A-Za-z]:", name) or "\x00" in name:
                  raise ValueError(f"Unsafe path: {name!r}")
              parts = [p for p in name.split("/") if p not in ("", ".")]
              if ".." in parts:
                  raise ValueError(f"Unsafe path: {name!r}")
              return "/".join(parts)

          def unpack(zip_path, root):
              root = Path(root).resolve()
              added, changed, unchanged, skipped = 0, 0, 0, 0

              with zipfile.ZipFile(zip_path) as archive:
                  infos = [i for i in archive.infolist() if not i.is_dir()]
                  names = [clean_name(i.filename) for i in infos]

                  if len(infos) > 3000 or sum(i.file_size for i in infos) > 60 * 2**20:
                      raise ValueError("ZIP exceeds file count or total size limit")
                  if any(i.file_size > 20 * 2**20 for i in infos):
                      raise ValueError("A file exceeds the 20 MiB limit")
                  if any(stat.S_ISLNK(i.external_attr >> 16) for i in infos):
                      raise ValueError("Symbolic links are not allowed")

                  tops = {n.split("/")[0] for n in names if "/" in n}
                  strip = len(tops) == 1 and all("/" in n for n in names)

                  for info, name in zip(infos, names):
                      rel = name.split("/", 1)[1] if strip else name

                      if rel == ".git" or rel.startswith(".git/") or "/.git/" in rel:
                          raise ValueError(f".git paths are not allowed: {rel}")

                      if (
                          rel.startswith(".github/workflows/")
                          or ("/" not in rel and rel.lower().endswith(".zip"))
                          or "__pycache__/" in rel
                          or rel.endswith(".pyc")
                          or rel == ".DS_Store"
                          or rel.startswith("__MACOSX/")
                      ):
                          skipped += 1
                          continue

                      dest = (root / posixpath.normpath(rel)).resolve()
                      if root not in dest.parents:
                          raise ValueError(f"Path escapes repository: {rel}")

                      data = archive.read(info)

                      if dest.exists() and dest.read_bytes() == data:
                          unchanged += 1
                          continue

                      if dest.exists():
                          changed += 1
                      else:
                          added += 1

                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)

              print(f"{zip_path}: {added} added, {changed} changed, "
                    f"{unchanged} unchanged, {skipped} skipped")

          if __name__ == "__main__":
              try:
                  for path in sys.argv[1:]:
                      unpack(path, ".")
              except (ValueError, zipfile.BadZipFile) as exc:
                  print(f"ERROR: {exc}", file=sys.stderr)
                  sys.exit(1)
          PYTHON

      - name: Unpack ZIP files
        run: |
          shopt -s nullglob
          zips=(*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP files found at repository root."
            exit 1
          fi

          python3 "$RUNNER_TEMP/unpack.py" "${zips[@]}"

          git rm -f --ignore-unmatch "${zips[@]}"

      - name: Fill in repository address
        run: |
          if [ -f tools/autofill.py ]; then
            python3 tools/autofill.py
          fi

      - name: Check repository
        continue-on-error: true
        run: |
          if [ -f tools/check.py ]; then
            python3 tools/check.py
          else
            echo "tools/check.py not found"
          fi

      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack Hana app ZIP"
          git push
